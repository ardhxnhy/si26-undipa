<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Monochrome Universitas Dipa Makassar Emblem -->
  <circle cx="100" cy="100" r="92" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.9"/>
  <circle cx="100" cy="100" r="82" fill="none" stroke="#666666" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="100" cy="100" r="72" fill="#0A0A0A" stroke="#333333" stroke-width="1"/>
  
  <!-- Outer Circular Text Ring -->
  <path id="textCircle" d="M 30,100 A 70,70 0 1,1 170,100 A 70,70 0 1,1 30,100" fill="none"/>
  
  <!-- Center Monogram & Shield -->
  <polygon points="100,45 138,68 138,118 100,148 62,118 62,68" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
  <polygon points="100,53 130,72 130,113 100,138 70,113 70,72" fill="#161616"/>
  
  <!-- Core Symbol: Torch & Data Crest -->
  <path d="M 100,62 L 100,106" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <path d="M 86,76 Q 100,82 114,76" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 88,92 Q 100,98 112,92" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  <circle cx="100" cy="62" r="4" fill="#FFFFFF"/>
  
  <!-- Monogram DIPA -->
  <text x="100" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">UNDIPA</text>
  <text x="100" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="7.5" font-weight="600" fill="#888888" text-anchor="middle" letter-spacing="1">MAKASSAR</text>
</svg>
